[package]
name = "blackcandy-cli"
version = "0.1.0"
edition = "2024"
description = "A command-line client for Black Candy music servers"
license = "MIT"
repository = "https://github.com/blackcandy-org/cli"
homepage = "https://github.com/blackcandy-org/cli"
readme = "README.md"
keywords = ["blackcandy", "music", "cli", "streaming"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "blackcandy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive", "env"] }
dirs = "6.0.0"
rpassword = "7.4.0"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
toml = "0.8.23"
url = "2.5.4"
which = "7.0.3"
